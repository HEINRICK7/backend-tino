# managed by TINO deployment
# Temporary HTTP listener used for the ACME HTTP-01 challenge.
# The deploy workflow replaces this file with tino.conf after certificates exist.
server {
    listen 80;
    listen [::]:80;
    server_name __TINO_API_HOST__ __TINO_AUTH_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tino-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
