# managed by TINO PWA deployment
# Temporary HTTP listener used for the ACME HTTP-01 challenge.
server {
    listen 80;
    listen [::]:80;
    server_name __TINO_PWA_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tino-pwa-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
