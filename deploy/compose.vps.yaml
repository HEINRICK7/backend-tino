name: tino

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tino_admin
      POSTGRES_PASSWORD: ${TINO_POSTGRES_ADMIN_PASSWORD:?missing TINO_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: tino
      TINO_POSTGRES_APP_PASSWORD: ${TINO_POSTGRES_APP_PASSWORD:?missing TINO_POSTGRES_APP_PASSWORD}
      TINO_POSTGRES_MIGRATOR_PASSWORD: ${TINO_POSTGRES_MIGRATOR_PASSWORD:?missing TINO_POSTGRES_MIGRATOR_PASSWORD}
    volumes:
      - tino-postgres:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tino_admin -d tino"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  keycloak-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?missing KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - tino-keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?missing KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TINO_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TINO_KEYCLOAK_ADMIN_PASSWORD:?missing TINO_KEYCLOAK_ADMIN_PASSWORD}
      VIRTUAL_HOST: ${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}
      LETSENCRYPT_EMAIL: ${TINO_LETSENCRYPT_EMAIL:?missing TINO_LETSENCRYPT_EMAIL}
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./tino-realm.json:/opt/keycloak/data/import/tino-realm.json:ro
    expose: ["8080"]
    restart: unless-stopped
    networks: [private, edge]

  app:
    image: ${TINO_IMAGE:?missing TINO_IMAGE}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tino
      SPRING_DATASOURCE_USERNAME: tino_app
      SPRING_DATASOURCE_PASSWORD: ${TINO_POSTGRES_APP_PASSWORD:?missing TINO_POSTGRES_APP_PASSWORD}
      SPRING_FLYWAY_USER: tino_migrator
      SPRING_FLYWAY_PASSWORD: ${TINO_POSTGRES_MIGRATOR_PASSWORD:?missing TINO_POSTGRES_MIGRATOR_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}/realms/tino
      TINO_SECURITY_OIDC_CLIENT_ID: tino-android
      TINO_FISCAL_MODE: ${TINO_FISCAL_MODE:-fixture}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-0.1}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      VIRTUAL_HOST: ${TINO_API_HOST:?missing TINO_API_HOST}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${TINO_API_HOST:?missing TINO_API_HOST}
      LETSENCRYPT_EMAIL: ${TINO_LETSENCRYPT_EMAIL:?missing TINO_LETSENCRYPT_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs: [/tmp]
    expose: ["8080"]
    restart: unless-stopped
    networks: [private, edge]

  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.7.0
    environment:
      ENABLE_IPV6: "true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tino-proxy-certs:/etc/nginx/certs:ro
      - tino-proxy-vhost:/etc/nginx/vhost.d
      - tino-proxy-html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped
    networks: [edge]

  acme-companion:
    image: nginxproxy/acme-companion:2.4.0
    environment:
      DEFAULT_EMAIL: ${TINO_LETSENCRYPT_EMAIL:?missing TINO_LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: tino-nginx-proxy-1
    depends_on:
      - nginx-proxy
    volumes_from:
      - nginx-proxy
    volumes:
      - tino-proxy-certs:/etc/nginx/certs:rw
      - tino-proxy-acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks: [edge]

volumes:
  tino-postgres:
  tino-keycloak-postgres:
  tino-proxy-certs:
  tino-proxy-vhost:
  tino-proxy-html:
  tino-proxy-acme:

networks:
  private:
    internal: true
  edge:
