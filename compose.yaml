services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tino_admin
      POSTGRES_PASSWORD: tino_admin
      POSTGRES_DB: tino
    ports: ["${TINO_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - tino-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tino_admin -d tino"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["${TINO_KEYCLOAK_PORT:-8081}:8080"]
    volumes:
      - ./docker/keycloak/tino-realm.json:/opt/keycloak/data/import/tino-realm.json:ro

volumes:
  tino-postgres:
