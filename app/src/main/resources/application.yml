spring:
  application:
    name: tino-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tino}
    username: ${SPRING_DATASOURCE_USERNAME:tino_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      auto-commit: false
      connection-timeout: 5000
  flyway:
    enabled: true
    user: ${SPRING_FLYWAY_USER:tino_migrator}
    password: ${SPRING_FLYWAY_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/tino}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
tino:
  security:
    oidc:
      client-id: ${TINO_SECURITY_OIDC_CLIENT_ID:tino-android}
server:
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}

otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      serpro:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  bulkhead:
    instances:
      serpro:
        max-concurrent-calls: 4
        max-wait-duration: 0ms
