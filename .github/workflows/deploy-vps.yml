name: build-and-deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tino-vps-production
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test private OTP delivery service
        working-directory: delivery
        run: go test ./...
      - name: Scan tracked files for hardcoded secrets
        run: ./scripts/secret-scan.sh
      - name: Validate Compose
        run: |
          ./scripts/create-local-env.sh
          docker compose config --quiet
      - name: Build, tests and architecture
        run: |
          set -a
          . ./.env
          set +a
          ./gradlew clean build architecture --no-daemon

  pwa:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pwa_sha: ${{ steps.checkout_pwa.outputs.commit }}
    steps:
      - name: Checkout Meu TINO PWA
        id: checkout_pwa
        uses: actions/checkout@v4
        with:
          repository: HEINRICK7/meu-tino
          ref: main
          path: meu-tino-pwa

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meu-tino-pwa/package-lock.json

      - name: Install PWA dependencies
        working-directory: meu-tino-pwa
        run: npm ci

      - name: Verify PWA
        working-directory: meu-tino-pwa
        run: |
          npm run format:check
          npm test
          npm run typecheck

      - name: Build PWA
        working-directory: meu-tino-pwa
        run: npm run build

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      keycloak_image: ${{ steps.meta.outputs.keycloak_image }}
      delivery_image: ${{ steps.meta.outputs.delivery_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=${image}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "keycloak_image=${image}-keycloak:${SHA}" >> "$GITHUB_OUTPUT"
          echo "delivery_image=${image}-delivery:${SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"
          echo "KEYCLOAK_IMAGE=${image}-keycloak" >> "$GITHUB_ENV"
          echo "DELIVERY_IMAGE=${image}-delivery" >> "$GITHUB_ENV"
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish Keycloak OTP provider image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/keycloak/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.keycloak_image }}
            ${{ env.KEYCLOAK_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish WhatsApp delivery image
        uses: docker/build-push-action@v6
        with:
          context: delivery
          file: delivery/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.delivery_image }}
            ${{ env.DELIVERY_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [publish, pwa]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tino-vps
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Meu TINO PWA
        uses: actions/checkout@v4
        with:
          repository: HEINRICK7/meu-tino
          ref: ${{ needs.pwa.outputs.pwa_sha }}
          path: meu-tino-pwa
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meu-tino-pwa/package-lock.json
      - name: Build PWA for deployment
        working-directory: meu-tino-pwa
        run: |
          npm ci
          npm run build
      - name: Install SSH material
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/tino_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tino_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload deployment definition
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          SSH_OPTS=(-4 -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i "$HOME/.ssh/tino_deploy")
          retry_ssh() {
            local attempt
            for attempt in 1 2 3; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          retry_scp() {
            local attempt
            for attempt in 1 2 3; do
              if scp "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          retry_ssh "$VPS_USER@$VPS_HOST" 'install -d -m 755 /opt/tino'
          retry_scp deploy/compose.vps.yaml "$VPS_USER@$VPS_HOST:/opt/tino/compose.vps.yaml"
          retry_scp docker/keycloak/configure-tino-otp-flow.sh "$VPS_USER@$VPS_HOST:/opt/tino/configure-tino-otp-flow.sh"
          retry_scp docker/keycloak/tino-realm.json "$VPS_USER@$VPS_HOST:/opt/tino/tino-realm.json"
          retry_scp docker/postgres/init.sh "$VPS_USER@$VPS_HOST:/opt/tino/init.sh"
          retry_scp deploy/nginx/tino-http.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino-http.conf"
          retry_scp deploy/nginx/tino.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino.conf"
          retry_scp deploy/nginx/tino-pwa-http.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino-pwa-http.conf"
          retry_scp deploy/nginx/tino-pwa.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino-pwa.conf"
      - name: Deploy without stopping other Compose projects
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TINO_ENV_FILE: ${{ secrets.TINO_VPS_ENV }}
          TINO_WHATSAPP_DELIVERY_ENABLED: ${{ secrets.TINO_WHATSAPP_DELIVERY_ENABLED }}
          TINO_IMAGE: ${{ needs.publish.outputs.image }}
          TINO_KEYCLOAK_IMAGE: ${{ needs.publish.outputs.keycloak_image }}
          TINO_DELIVERY_IMAGE: ${{ needs.publish.outputs.delivery_image }}
          TINO_PWA_HOST: app.tino.otimizanegocio.com
        run: |
          set -euo pipefail
          test -n "$TINO_ENV_FILE"
          test "$TINO_WHATSAPP_DELIVERY_ENABLED" = "true"
          SSH_OPTS=(-4 -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i "$HOME/.ssh/tino_deploy")
          retry_ssh() {
            local attempt
            for attempt in 1 2 3; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          retry_scp() {
            local attempt
            for attempt in 1 2 3; do
              if scp "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          tar -C meu-tino-pwa/dist -czf "$RUNNER_TEMP/tino-pwa.tar.gz" .
          retry_scp "$RUNNER_TEMP/tino-pwa.tar.gz" "$VPS_USER@$VPS_HOST:/opt/tino/pwa-${GITHUB_SHA}.tar.gz"
          printf '%s\n' "$TINO_ENV_FILE" \
            | sed '/^TINO_WHATSAPP_DELIVERY_ENABLED=/d' \
            | { cat; printf 'TINO_WHATSAPP_DELIVERY_ENABLED=%s\n' "$TINO_WHATSAPP_DELIVERY_ENABLED"; } \
            | retry_ssh "$VPS_USER@$VPS_HOST" 'umask 077; cat > /opt/tino/.env.next'
          retry_ssh "$VPS_USER@$VPS_HOST" "TINO_PWA_HOST='$TINO_PWA_HOST' /bin/sh -s" <<'REMOTE_ENV'
          set -eu
          env_file=/opt/tino/.env.next
          whatsapp_token="$(sed -n 's/^TINO_WHATSAPP_DELIVERY_INTERNAL_TOKEN=//p' "$env_file" | head -n 1)"
          if test -z "$whatsapp_token"; then
            otp_delivery_token="$(sed -n 's/^TINO_OTP_DELIVERY_INTERNAL_TOKEN=//p' "$env_file" | head -n 1)"
            test -n "$otp_delivery_token"
            sed -i '/^TINO_WHATSAPP_DELIVERY_INTERNAL_TOKEN=/d' "$env_file"
            printf 'TINO_WHATSAPP_DELIVERY_INTERNAL_TOKEN=%s\n' "$otp_delivery_token" >> "$env_file"
          fi
          customer_channel_base="$(sed -n 's/^TINO_CUSTOMER_CHANNEL_PUBLIC_BASE_URL=//p' "$env_file" | head -n 1)"
          if test -z "$customer_channel_base"; then
            printf 'TINO_CUSTOMER_CHANNEL_PUBLIC_BASE_URL=https://%s\n' "$TINO_PWA_HOST" >> "$env_file"
          fi
          session_secure="$(sed -n 's/^TINO_CUSTOMER_CHANNEL_SESSION_SECURE=//p' "$env_file" | head -n 1)"
          if test -z "$session_secure"; then
            printf 'TINO_CUSTOMER_CHANNEL_SESSION_SECURE=true\n' >> "$env_file"
          fi
          REMOTE_ENV
          printf '%s' "$GHCR_TOKEN" | retry_ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          retry_ssh "$VPS_USER@$VPS_HOST" \
            "TINO_IMAGE='$TINO_IMAGE' TINO_KEYCLOAK_IMAGE='$TINO_KEYCLOAK_IMAGE' TINO_DELIVERY_IMAGE='$TINO_DELIVERY_IMAGE' docker compose --env-file /opt/tino/.env.next -f /opt/tino/compose.vps.yaml config --quiet"
          if ! ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            "TINO_IMAGE='$TINO_IMAGE' TINO_KEYCLOAK_IMAGE='$TINO_KEYCLOAK_IMAGE' TINO_DELIVERY_IMAGE='$TINO_DELIVERY_IMAGE' TINO_PWA_HOST='$TINO_PWA_HOST' TINO_RELEASE_SHA='$GITHUB_SHA' /bin/sh -s" <<'REMOTE'
          set -eu
          cd /opt/tino
          staged_env=/opt/tino/.env.next
          env_file="$staged_env"
          trap 'rm -f "$staged_env"' EXIT
          dotenv_value() {
            value="$(sed -n "s/^$1=//p" "$env_file" | head -n 1)"
            case "$value" in
              \'*\') value="${value#\\'}"; value="${value%\\'}" ;;
              \"*\") value="${value#\\\"}"; value="${value%\\\"}" ;;
            esac
            printf '%s' "$value"
          }
          TINO_API_HOST="$(dotenv_value TINO_API_HOST)"
          TINO_AUTH_HOST="$(dotenv_value TINO_AUTH_HOST)"
          TINO_VPS_IPV4="$(dotenv_value TINO_VPS_IPV4)"
          TINO_LETSENCRYPT_EMAIL="$(dotenv_value TINO_LETSENCRYPT_EMAIL)"
          TINO_OTP_ENABLED="$(dotenv_value TINO_OTP_ENABLED)"
          TINO_WHATSAPP_DELIVERY_ENABLED="$(dotenv_value TINO_WHATSAPP_DELIVERY_ENABLED)"
          : "${TINO_API_HOST:?missing TINO_API_HOST}"
          : "${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}"
          : "${TINO_VPS_IPV4:?missing TINO_VPS_IPV4}"
          : "${TINO_LETSENCRYPT_EMAIL:?missing TINO_LETSENCRYPT_EMAIL}"
          test "$TINO_OTP_ENABLED" = "true" || {
            echo 'Production deployment requires TINO_OTP_ENABLED=true; refusing to publish a login-disabled backend' >&2
            exit 27
          }
          test "$TINO_WHATSAPP_DELIVERY_ENABLED" = "true" || {
            echo 'Production deployment requires TINO_WHATSAPP_DELIVERY_ENABLED=true; refusing to publish an unconnected WhatsApp renderer' >&2
            exit 31
          }
          for required_otp_secret in TINO_OTP_HASH_SECRET TINO_OTP_INTERNAL_TOKEN TINO_OTP_DELIVERY_INTERNAL_TOKEN WA_EVOLUTION_BASE_URL WA_EVOLUTION_API_KEY WA_EVOLUTION_INSTANCE; do
            value="$(dotenv_value "$required_otp_secret")"
            test -n "$value" || {
              echo "Production deployment is missing $required_otp_secret; refusing to publish an unusable OTP stack" >&2
              exit 28
            }
          done
          if test "$TINO_WHATSAPP_DELIVERY_ENABLED" = "true"; then
            for required_whatsapp_secret in TINO_WHATSAPP_DELIVERY_INTERNAL_TOKEN WA_EVOLUTION_BASE_URL WA_EVOLUTION_API_KEY WA_EVOLUTION_INSTANCE; do
              value="$(dotenv_value "$required_whatsapp_secret")"
              test -n "$value" || {
                echo "Production deployment is missing $required_whatsapp_secret; refusing to publish an unusable WhatsApp renderer" >&2
                exit 30
              }
            done
          fi
          webhook_secret="$(dotenv_value WA_EVOLUTION_WEBHOOK_SECRET)"
          webhook_token="$(dotenv_value WA_EVOLUTION_WEBHOOK_TOKEN)"
          test -n "$webhook_secret" || test -n "$webhook_token" || {
            echo 'Production deployment requires WA_EVOLUTION_WEBHOOK_SECRET or WA_EVOLUTION_WEBHOOK_TOKEN' >&2
            exit 29
          }
          for host in "$TINO_API_HOST" "$TINO_AUTH_HOST"; do
            resolved="$(getent ahostsv4 "$host" | awk 'NR == 1 {print $1}')"
            test "$resolved" = "$TINO_VPS_IPV4" || {
              echo "DNS $host does not resolve to the configured VPS address" >&2
              exit 20
            }
          done
          pwa_resolved="$(getent ahostsv4 "$TINO_PWA_HOST" | awk 'NR == 1 {print $1}')"
          test "$pwa_resolved" = "$TINO_VPS_IPV4" || {
            echo "DNS $TINO_PWA_HOST does not resolve to the configured VPS address" >&2
            exit 32
          }
          customer_channel_base="$(dotenv_value TINO_CUSTOMER_CHANNEL_PUBLIC_BASE_URL)"
          case "$customer_channel_base" in
            https://*) ;;
            *)
              echo 'Production deployment requires an HTTPS TINO_CUSTOMER_CHANNEL_PUBLIC_BASE_URL' >&2
              exit 33
              ;;
          esac
          session_secure="$(dotenv_value TINO_CUSTOMER_CHANNEL_SESSION_SECURE)"
          test "$session_secure" = "true" || {
            echo 'Production deployment requires TINO_CUSTOMER_CHANNEL_SESSION_SECURE=true' >&2
            exit 34
          }
          systemctl is-active --quiet nginx || {
            echo 'The existing host Nginx service is not active; aborting without changing it' >&2
            exit 25
          }
          pwa_nginx_config=/etc/nginx/sites-available/tino-pwa.conf
          pwa_nginx_link=/etc/nginx/sites-enabled/tino-pwa.conf
          if test -e "$pwa_nginx_config" && ! grep -q 'managed by TINO PWA deployment' "$pwa_nginx_config"; then
            echo "Refusing to overwrite an unrelated Nginx configuration: $pwa_nginx_config" >&2
            exit 35
          fi
          if test -e "$pwa_nginx_link" && ! test -L "$pwa_nginx_link"; then
            echo "Refusing to overwrite an unrelated Nginx site entry: $pwa_nginx_link" >&2
            exit 36
          fi
          pwa_release=/opt/tino/pwa/releases/$TINO_RELEASE_SHA
          install -d -m 755 "$pwa_release" /opt/tino/pwa/releases
          tar -xzf "/opt/tino/pwa-$TINO_RELEASE_SHA.tar.gz" -C "$pwa_release"
          rm -f "/opt/tino/pwa-$TINO_RELEASE_SHA.tar.gz"
          ln -sfn "$pwa_release" /opt/tino/pwa/current
          install -d -m 755 /var/www/tino-pwa-acme
          sed -e "s/__TINO_PWA_HOST__/$TINO_PWA_HOST/g" \
            /opt/tino/tino-pwa-http.conf > "$pwa_nginx_config"
          ln -sfn "$pwa_nginx_config" "$pwa_nginx_link"
          nginx -t
          systemctl reload nginx
          certbot certonly --webroot -w /var/www/tino-pwa-acme \
            --cert-name tino-pwa \
            -d "$TINO_PWA_HOST" \
            --non-interactive --agree-tos --keep-until-expiring \
            --email "$TINO_LETSENCRYPT_EMAIL"
          sed -e "s/__TINO_PWA_HOST__/$TINO_PWA_HOST/g" \
            /opt/tino/tino-pwa.conf > "$pwa_nginx_config"
          nginx -t
          systemctl reload nginx
          nginx_config=/etc/nginx/sites-available/tino-backend.conf
          nginx_link=/etc/nginx/sites-enabled/tino-backend.conf
          if test -e "$nginx_config" && ! grep -q 'managed by TINO deployment' "$nginx_config"; then
            echo "Refusing to overwrite an unrelated Nginx configuration: $nginx_config" >&2
            exit 23
          fi
          if test -e "$nginx_link" && ! test -L "$nginx_link"; then
            echo "Refusing to overwrite an unrelated Nginx site entry: $nginx_link" >&2
            exit 24
          fi
          for port in 18080 18581; do
            if ss -ltnH "( sport = :$port )" | grep -q .; then
              owned="$(docker ps --filter label=com.docker.compose.project=tino --format '{{.Ports}}' | grep -E "(^|[ ,])[^ ]*:$port->" || true)"
              test -n "$owned" || {
                echo "Private TINO port $port is already occupied by another service; aborting without stopping anything" >&2
                exit 21
              }
            fi
          done
          install -d -m 755 /var/www/tino-acme
          sed -e "s/__TINO_API_HOST__/$TINO_API_HOST/g" \
            -e "s/__TINO_AUTH_HOST__/$TINO_AUTH_HOST/g" \
            /opt/tino/tino-http.conf > "$nginx_config"
          ln -sfn "$nginx_config" "$nginx_link"
          nginx -t
          systemctl reload nginx
          certbot certonly --webroot -w /var/www/tino-acme \
            --cert-name tino \
            -d "$TINO_API_HOST" -d "$TINO_AUTH_HOST" \
            --non-interactive --agree-tos --keep-until-expiring \
            --email "$TINO_LETSENCRYPT_EMAIL"
          mv "$staged_env" /opt/tino/.env
          env_file=/opt/tino/.env
          compose() {
            docker compose --env-file "$env_file" -f /opt/tino/compose.vps.yaml "$@"
          }
          if test "$TINO_OTP_ENABLED" = "true" || test "$TINO_WHATSAPP_DELIVERY_ENABLED" = "true"; then
            compose --profile otp pull app keycloak otp-delivery
            compose --profile otp up -d --no-build --remove-orphans
          else
            compose pull app keycloak
            compose up -d --no-build --remove-orphans
          fi
          for port in 18080 18581; do
            docker ps --filter label=com.docker.compose.project=tino --format '{{.Ports}}' | grep -E "(^|[ ,])[^ ]*:$port->" >/dev/null || {
              echo "TINO port $port was not published by Docker" >&2
              exit 26
            }
          done
          sed -e "s/__TINO_API_HOST__/$TINO_API_HOST/g" \
            -e "s/__TINO_AUTH_HOST__/$TINO_AUTH_HOST/g" \
            /opt/tino/tino.conf > "$nginx_config"
          nginx -t
          systemctl reload nginx
          compose ps
          readiness_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$TINO_API_HOST/actuator/health/readiness" >/dev/null; then
              readiness_ok=true
              break
            fi
            sleep 5
          done
          test "$readiness_ok" = true || {
            echo 'TINO readiness check failed' >&2
            compose ps
            exit 22
          }
          pwa_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://$TINO_PWA_HOST/api/v1/me")"
          test "$pwa_status" = 401 || test "$pwa_status" = 403 || {
            echo "TINO PWA API proxy returned unexpected HTTP status $pwa_status" >&2
            exit 37
          }
          pwa_activation_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X POST "https://$TINO_PWA_HOST/api/v1/customer-channel/activation" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-invalid-activation-smoke' \
            --data-binary '{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}')"
          test "$pwa_activation_status" = 410 || {
            echo "TINO PWA activation proxy returned unexpected HTTP status $pwa_activation_status" >&2
            exit 39
          }
          activation_body=/tmp/tino-activation-smoke.json
          activation_status="$(curl --silent --show-error --output "$activation_body" --write-out '%{http_code}' \
            -X POST "https://$TINO_API_HOST/api/v1/customer-channel/activation" \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-invalid-activation-smoke' \
            --data-binary '{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}')"
          if test "$activation_status" != 410; then
            echo "TINO customer-channel activation returned unexpected HTTP status $activation_status for an invalid token" >&2
            echo 'Recent customer-channel backend diagnostics:' >&2
            compose logs --no-color --tail=160 app 2>&1 \
              | grep -Ei 'customer.?channel|exception|error|warn|sql|permission|denied|401|403|500' \
              | tail -n 100 >&2 || true
            exit 38
          fi
          curl --fail --silent --show-error "https://$TINO_PWA_HOST/" >/dev/null
          curl --fail --silent --show-error "https://$TINO_PWA_HOST/manifest.webmanifest" >/dev/null
          REMOTE
          then
            echo 'Remote TINO deployment failed' >&2
            exit 1
          fi
          retry_ssh "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
