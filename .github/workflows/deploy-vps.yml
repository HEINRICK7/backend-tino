name: build-and-deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tino-vps-production
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test private OTP delivery service
        working-directory: delivery
        run: go test ./...
      - name: Scan tracked files for hardcoded secrets
        run: ./scripts/secret-scan.sh
      - name: Validate Compose
        run: |
          ./scripts/create-local-env.sh
          docker compose config --quiet
      - name: Build, tests and architecture
        run: |
          set -a
          . ./.env
          set +a
          ./gradlew clean build architecture --no-daemon

  publish:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      keycloak_image: ${{ steps.meta.outputs.keycloak_image }}
      delivery_image: ${{ steps.meta.outputs.delivery_image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define image tags
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=${image}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "keycloak_image=${image}-keycloak:${SHA}" >> "$GITHUB_OUTPUT"
          echo "delivery_image=${image}-delivery:${SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_NAME=${image}" >> "$GITHUB_ENV"
          echo "KEYCLOAK_IMAGE=${image}-keycloak" >> "$GITHUB_ENV"
          echo "DELIVERY_IMAGE=${image}-delivery" >> "$GITHUB_ENV"
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish Keycloak OTP provider image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/keycloak/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.keycloak_image }}
            ${{ env.KEYCLOAK_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish WhatsApp delivery image
        uses: docker/build-push-action@v6
        with:
          context: delivery
          file: delivery/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.delivery_image }}
            ${{ env.DELIVERY_IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: tino-vps
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH material
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_PRIVATE_KEY" > "$HOME/.ssh/tino_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/tino_deploy" "$HOME/.ssh/known_hosts"
      - name: Upload deployment definition
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          SSH_OPTS=(-4 -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i "$HOME/.ssh/tino_deploy")
          retry_ssh() {
            local attempt
            for attempt in 1 2 3; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          retry_scp() {
            local attempt
            for attempt in 1 2 3; do
              if scp "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          retry_ssh "$VPS_USER@$VPS_HOST" 'install -d -m 700 /opt/tino'
          retry_scp deploy/compose.vps.yaml "$VPS_USER@$VPS_HOST:/opt/tino/compose.vps.yaml"
          retry_scp docker/keycloak/configure-tino-otp-flow.sh "$VPS_USER@$VPS_HOST:/opt/tino/configure-tino-otp-flow.sh"
          retry_scp docker/keycloak/tino-realm.json "$VPS_USER@$VPS_HOST:/opt/tino/tino-realm.json"
          retry_scp docker/postgres/init.sh "$VPS_USER@$VPS_HOST:/opt/tino/init.sh"
          retry_scp deploy/nginx/tino-http.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino-http.conf"
          retry_scp deploy/nginx/tino.conf "$VPS_USER@$VPS_HOST:/opt/tino/tino.conf"
      - name: Deploy without stopping other Compose projects
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TINO_ENV_FILE: ${{ secrets.TINO_VPS_ENV }}
          TINO_IMAGE: ${{ needs.publish.outputs.image }}
          TINO_KEYCLOAK_IMAGE: ${{ needs.publish.outputs.keycloak_image }}
          TINO_DELIVERY_IMAGE: ${{ needs.publish.outputs.delivery_image }}
        run: |
          set -euo pipefail
          test -n "$TINO_ENV_FILE"
          SSH_OPTS=(-4 -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=3 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i "$HOME/.ssh/tino_deploy")
          retry_ssh() {
            local attempt
            for attempt in 1 2 3; do
              if ssh "${SSH_OPTS[@]}" "$@"; then
                return 0
              fi
              test "$attempt" -lt 3 && sleep $((attempt * 3))
            done
            return 1
          }
          printf '%s\n' "$TINO_ENV_FILE" | retry_ssh "$VPS_USER@$VPS_HOST" 'umask 077; cat > /opt/tino/.env.next'
          printf '%s' "$GHCR_TOKEN" | retry_ssh "$VPS_USER@$VPS_HOST" "docker login ghcr.io --username '$GHCR_USER' --password-stdin"
          retry_ssh "$VPS_USER@$VPS_HOST" \
            "TINO_IMAGE='$TINO_IMAGE' TINO_KEYCLOAK_IMAGE='$TINO_KEYCLOAK_IMAGE' TINO_DELIVERY_IMAGE='$TINO_DELIVERY_IMAGE' docker compose --env-file /opt/tino/.env.next -f /opt/tino/compose.vps.yaml config --quiet"
          if ! retry_ssh "$VPS_USER@$VPS_HOST" \
            "TINO_IMAGE='$TINO_IMAGE' TINO_KEYCLOAK_IMAGE='$TINO_KEYCLOAK_IMAGE' TINO_DELIVERY_IMAGE='$TINO_DELIVERY_IMAGE' /bin/sh -s" <<'REMOTE'
          set -eu
          cd /opt/tino
          staged_env=/opt/tino/.env.next
          env_file="$staged_env"
          trap 'rm -f "$staged_env"' EXIT
          dotenv_value() {
            value="$(sed -n "s/^$1=//p" "$env_file" | head -n 1)"
            case "$value" in
              \'*\') value="${value#\\'}"; value="${value%\\'}" ;;
              \"*\") value="${value#\\\"}"; value="${value%\\\"}" ;;
            esac
            printf '%s' "$value"
          }
          TINO_API_HOST="$(dotenv_value TINO_API_HOST)"
          TINO_AUTH_HOST="$(dotenv_value TINO_AUTH_HOST)"
          TINO_VPS_IPV4="$(dotenv_value TINO_VPS_IPV4)"
          TINO_LETSENCRYPT_EMAIL="$(dotenv_value TINO_LETSENCRYPT_EMAIL)"
          TINO_OTP_ENABLED="$(dotenv_value TINO_OTP_ENABLED)"
          : "${TINO_API_HOST:?missing TINO_API_HOST}"
          : "${TINO_AUTH_HOST:?missing TINO_AUTH_HOST}"
          : "${TINO_VPS_IPV4:?missing TINO_VPS_IPV4}"
          : "${TINO_LETSENCRYPT_EMAIL:?missing TINO_LETSENCRYPT_EMAIL}"
          for host in "$TINO_API_HOST" "$TINO_AUTH_HOST"; do
            resolved="$(getent ahostsv4 "$host" | awk 'NR == 1 {print $1}')"
            test "$resolved" = "$TINO_VPS_IPV4" || {
              echo "DNS $host does not resolve to the configured VPS address" >&2
              exit 20
            }
          done
          nginx_config=/etc/nginx/sites-available/tino-backend.conf
          nginx_link=/etc/nginx/sites-enabled/tino-backend.conf
          if test -e "$nginx_config" && ! grep -q 'managed by TINO deployment' "$nginx_config"; then
            echo "Refusing to overwrite an unrelated Nginx configuration: $nginx_config" >&2
            exit 23
          fi
          if test -e "$nginx_link" && ! test -L "$nginx_link"; then
            echo "Refusing to overwrite an unrelated Nginx site entry: $nginx_link" >&2
            exit 24
          fi
          for port in 18080 18581; do
            if ss -ltnH "( sport = :$port )" | grep -q .; then
              owned="$(docker ps --filter label=com.docker.compose.project=tino --format '{{.Ports}}' | grep -E "(^|[ ,])[^ ]*:$port->" || true)"
              test -n "$owned" || {
                echo "Private TINO port $port is already occupied by another service; aborting without stopping anything" >&2
                exit 21
              }
            fi
          done
          systemctl is-active --quiet nginx || {
            echo 'The existing host Nginx service is not active; aborting without changing it' >&2
            exit 25
          }
          install -d -m 755 /var/www/tino-acme
          sed -e "s/__TINO_API_HOST__/$TINO_API_HOST/g" \
            -e "s/__TINO_AUTH_HOST__/$TINO_AUTH_HOST/g" \
            /opt/tino/tino-http.conf > "$nginx_config"
          ln -sfn "$nginx_config" "$nginx_link"
          nginx -t
          systemctl reload nginx
          certbot certonly --webroot -w /var/www/tino-acme \
            --cert-name tino \
            -d "$TINO_API_HOST" -d "$TINO_AUTH_HOST" \
            --non-interactive --agree-tos --keep-until-expiring \
            --email "$TINO_LETSENCRYPT_EMAIL"
          mv "$staged_env" /opt/tino/.env
          env_file=/opt/tino/.env
          compose() {
            docker compose --env-file "$env_file" -f /opt/tino/compose.vps.yaml "$@"
          }
          if test "$TINO_OTP_ENABLED" = "true"; then
            compose --profile otp pull app keycloak otp-delivery
            compose --profile otp up -d --no-build --remove-orphans
          else
            compose pull app keycloak
            compose up -d --no-build --remove-orphans
          fi
          for port in 18080 18581; do
            docker ps --filter label=com.docker.compose.project=tino --format '{{.Ports}}' | grep -E "(^|[ ,])[^ ]*:$port->" >/dev/null || {
              echo "TINO port $port was not published by Docker" >&2
              exit 26
            }
          done
          sed -e "s/__TINO_API_HOST__/$TINO_API_HOST/g" \
            -e "s/__TINO_AUTH_HOST__/$TINO_AUTH_HOST/g" \
            /opt/tino/tino.conf > "$nginx_config"
          nginx -t
          systemctl reload nginx
          compose ps
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$TINO_API_HOST/actuator/health/readiness" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo 'TINO readiness check failed' >&2
          compose ps
          exit 22
          REMOTE
          then
            echo 'Remote TINO deployment failed' >&2
            exit 1
          fi
          retry_ssh "$VPS_USER@$VPS_HOST" 'docker logout ghcr.io >/dev/null 2>&1 || true'
