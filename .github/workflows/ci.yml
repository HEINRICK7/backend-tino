name: backend-foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Scan tracked application sources for hardcoded secrets
        run: ./scripts/secret-scan.sh
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build, tests and architecture
        run: ./gradlew clean build architecture --no-daemon
